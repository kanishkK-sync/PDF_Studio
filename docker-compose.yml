services:
  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PORT: "8000"
      FRONTEND_ORIGIN: http://localhost:3000
      RATE_LIMIT_PER_MINUTE: "30"
      MAX_UPLOAD_MB: "100"
      MAX_IMAGES: "50"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)"]
      interval: 10s
      timeout: 6s
      start_period: 30s
      retries: 5

  frontend:
    image: node:24-bookworm-slim
    working_dir: /app
    command: ["sh", "-c", "npm ci && npm run dev -- --hostname 0.0.0.0"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      # This URL is used by the host browser, not by the frontend container.
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_SITE_URL: http://localhost:3000
      NEXT_PUBLIC_MAX_UPLOAD_MB: "100"
      NEXT_PUBLIC_MAX_IMAGES: "50"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - frontend_next:/app/.next
    depends_on:
      backend:
        condition: service_healthy

volumes:
  frontend_node_modules:
  frontend_next:
